<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Qiang Li, PhD</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .contact-layout {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 55px;
      align-items: start;
      max-width: 1100px;
      margin-top: 35px;
    }

    .contact-info h2 {
      margin-top: 0;
      color: #153a63;
    }

    .contact-info p {
      line-height: 1.8;
      margin-bottom: 22px;
    }

    .contact-info a {
      color: #153a63;
      text-decoration: underline;
    }

    .map-container {
      width: 100%;
      height: 380px;
      overflow: hidden;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 700px) {
      .contact-layout {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .map-container {
        height: 320px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">Li Lab</a>
    <nav aria-label="Main navigation">
      <a href="index.html">HOME</a>
      <a href="research.html">RESEARCH</a>
      <a href="publications.html">PUBLICATIONS</a>
      <a href="lab-members.html">LAB MEMBERS</a>
      <a href="contact.html" aria-current="page">CONTACT</a>
    </nav>
  </header>

  <main>
    <h1>Contact</h1>

    <div class="contact-layout">

      <!-- Left: Contact information -->
      <section class="contact-info">
        <h2>Qiang Li, PhD</h2>

        <p>
          <strong>Email:</strong><br>
          <a href="mailto:qxl465@case.edu">qxl465@case.edu</a>
        </p>

        <p>
          <strong>Phone:</strong><br>
          <a href="tel:+16173085658">617-308-5658</a>
        </p>

        <p>
          <strong>Address:</strong><br>
          2109 Adelbert Rd, Robbins Building<br>
          Cleveland, OH 44106
        </p>
      </section>

      <!-- Right: Interactive Google Map -->
      <div class="map-container">
        <iframe
          src="https://maps.google.com/maps?q=Robbins%20Building%2C%202109%20Adelbert%20Rd%2C%20Cleveland%2C%20OH%2044106&t=&z=15&ie=UTF8&iwloc=&output=embed"
          title="Google Map showing Robbins Building, Case Western Reserve University"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>

    </div>
  </main>

  <footer>
    © Qiang Li
  </footer>
</body>
</html>
