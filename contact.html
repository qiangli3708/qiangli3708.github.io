
<!DOCTYPE html>

<head>

  <title>Contact | Qiang Li, PhD</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Two columns: contact information and map */
    .contact-layout {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 40px;
      align-items: start;
      max-width: 1100px;
      margin: 30px auto;
    }

    /* Left column */
    .contact-info {
      margin: 0;
      padding: 0;
    }

    .contact-info h2 {
      margin-top: 0;
      color: #153a63;
    }

    .contact-info p {
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .contact-info a {
      color: #153a63;
    }

    /* Right column: Google Map */
    .map-container {
      width: 100%;
      height: 400px;
      margin: 0;
      padding: 0;
      border-radius: 10px;
      overflow: hidden;
    }

    .map-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Mobile layout */
    @media (max-width: 700px) {
      .contact-layout {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .map-container {
        height: 320px;
      }
    }
  </style>
</head>
